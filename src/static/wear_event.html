<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Внести запись</title>
<!-- <link rel="stylesheet" href="/static/base.css"> -->
<style>

:root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text-main: #1f2933;
    --text-secondary: #6b7280;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    --radius: 18px;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-main);
}

/* ===== PAGE HEADER ===== */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.back-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
}

.back-btn:hover {
    background: var(--accent-hover);
}
h2 {
    margin: 0;
    padding: 32px;
    font-size: 32px;
}

/* ===== LAYOUT ===== */

.container {
    max-width: 1200px;
    margin: auto;
    padding: 0 32px 48px;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 24px;
}

/* ===== CARDS ===== */

.left,
.right {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
}

.left h3,
.right h3,
.right h4 {
    margin-top: 0;
}

/* ===== CATEGORIES ===== */

.categories {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}

.categories button {
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #fafafa;
    font-size: 13px;
    color: var(--text-main); 
}

.categories button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

/* ===== GROUPING ===== */

.grouping {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.grouping button {
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #fafafa;
    font-size: 13px;
    color: var(--text-main); 
}

.grouping button.active {
    background: #e0e7ff;
    border-color: var(--accent);
    color: var(--accent);
}

/* ===== GROUPS ===== */

.group {
    margin-bottom: 28px;
}

.group-title {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
}

/* ===== ITEMS GRID ===== */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}

.item {
    background: #fafafa;
    border-radius: 14px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border 0.15s ease, background 0.15s ease;
}

.item:hover {
    background: #f3f4f6;
}

.item.selected {
    border-color: var(--accent);
    background: #ede9fe;
}

.item img {
    max-width: 100px;
    max-height: 140px;
    object-fit: contain;
    margin-bottom: 6px;
}

/* ===== EVENT BOX ===== */

.event-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.event-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
}

.event-item button {
    background: none;
    border: none;
    cursor: pointer;
}

/* ===== COLLAGE ===== */

.collage {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
    margin-top: 8px;
}

.collage img {
    width: 100%;
    height: 90px;
    object-fit: contain;
    border-radius: 10px;
    background: #fafafa;
}

/* ===== FORMS ===== */

input[type="date"],
textarea {
    font-family: inherit;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

textarea {
    resize: vertical;
}

/* ===== BUTTONS ===== */

button {
    padding: 8px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;

}

button:hover {
    background: var(--accent-hover);
}

/* ===== STATES ===== */

.success {
    color: #15803d;
    font-size: 13px;
}

.error {
    color: #b91c1c;
    font-size: 13px;
}

.muted {
    color: var(--text-secondary);
    font-size: 13px;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 16px 0;
}
</style>
</head>

<body>

<!-- <h2>Wear Event</h2> -->
<header>
    <h1>Внести запись эвента</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>

<div class="container">

<!-- ===== LEFT ===== -->
<div class="left">
    <h3>Гардероб</h3>

    <div id="categories" class="categories"></div>

    <div class="grouping">
        <button data-mode="none" class="active">Без групп</button>
        <button data-mode="season">По сезону</button>
        <button data-mode="style">По стилю</button>
    </div>

    <div id="itemsGrid"></div>
</div>

<!-- ===== RIGHT ===== -->
<div class="right">
    <div class="event-box">
        <h3>Текущий выход</h3>

        <p>
            Event: <b id="eventLabel"></b><br>
            <button id="goToLogsBtn">Перейти к логам</button>
        </p>

        <input type="date" id="eventDate">

        <div id="eventItems"></div>

        <div id="collage" class="collage"></div>

        <textarea id="notes" placeholder="Заметка" style="width:100%; margin-top:10px"></textarea>

        <button id="saveBtn">Сохранить выход</button>
        <p id="status"></p>

        <hr>

        <h4>Только что сохранённый выход</h4>
        <div id="savedEvent" class="muted">Пока нет данных</div>
    </div>
</div>

</div>

<script>
const gridRoot = document.getElementById("itemsGrid");
const categoriesDiv = document.getElementById("categories");
const eventItemsDiv = document.getElementById("eventItems");
const collageDiv = document.getElementById("collage");
const statusEl = document.getElementById("status");
const savedEventDiv = document.getElementById("savedEvent");

let itemsByCategory = {};
let itemsById = {};
let selectedItemIds = new Set();
let currentCategory = null;
let groupingMode = "none";
let currentEventId = Math.floor(Date.now() / 1000);

document.getElementById("eventLabel").textContent = currentEventId;

/* ===== NAV ===== */

document.getElementById("goToLogsBtn").onclick = () => {
    window.location.href = "/static/add_wear_log.html";
};

/* ===== GROUPING BUTTONS ===== */

document.querySelectorAll(".grouping button").forEach(btn => {
    btn.onclick = () => {
        groupingMode = btn.dataset.mode;
        document.querySelectorAll(".grouping button")
            .forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderItems();
    };
});

/* ===== LOAD ITEMS ===== */

async function loadItems() {
    const res = await fetch("/items/");
    const items = await res.json();

    itemsByCategory = {};
    itemsById = {};

    items.forEach(item => {
        itemsById[item.id] = item;
        const cat = item.category || "Other";
        if (!itemsByCategory[cat]) itemsByCategory[cat] = [];
        itemsByCategory[cat].push(item);
    });

    renderCategories();
}

/* ===== CATEGORIES ===== */

function renderCategories() {
    categoriesDiv.innerHTML = "";

    Object.keys(itemsByCategory).forEach((cat, idx) => {
        const btn = document.createElement("button");
        btn.textContent = cat;

        if (!currentCategory && idx === 0) currentCategory = cat;
        if (cat === currentCategory) btn.classList.add("active");

        btn.onclick = () => {
            currentCategory = cat;
            renderCategories();
            renderItems();
        };

        categoriesDiv.appendChild(btn);
    });

    renderItems();
}

/* ===== ITEMS ===== */

function renderItems() {
    gridRoot.innerHTML = "";
    const items = itemsByCategory[currentCategory] || [];

    if (groupingMode === "none") {
        const grid = createGrid(items);
        gridRoot.appendChild(grid);
    } else {
        const groups = {};

        items.forEach(item => {
            const key = item[groupingMode] || "Other";
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });

        Object.keys(groups).sort().forEach(groupName => {
            const section = document.createElement("div");
            section.className = "group";

            const title = document.createElement("div");
            title.className = "group-title";
            title.textContent = groupName;

            section.appendChild(title);
            section.appendChild(createGrid(groups[groupName]));
            gridRoot.appendChild(section);
        });
    }

    renderEventItems();
    renderCollage();
}

function createGrid(items) {
    const grid = document.createElement("div");
    grid.className = "grid";

    items.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        if (selectedItemIds.has(item.id)) div.classList.add("selected");

        if (item.image_path && item.category) {
            const img = document.createElement("img");
            const file = item.image_path.split("/").pop().replace(/\.[^/.]+$/, "");
            img.src = `/segmented/${item.category}/${file}_${item.category}.png`;
            div.appendChild(img);
        }

        div.append(item.item);
        div.onclick = () => toggleItem(item.id);
        grid.appendChild(div);
    });

    return grid;
}

/* ===== EVENT SIDE ===== */

function toggleItem(id) {
    selectedItemIds.has(id)
        ? selectedItemIds.delete(id)
        : selectedItemIds.add(id);

    renderItems();
}

function renderEventItems() {
    eventItemsDiv.innerHTML = "";

    selectedItemIds.forEach(id => {
        const row = document.createElement("div");
        row.className = "event-item";
        row.innerHTML = `
            <span>${itemsById[id].item}</span>
            <button>❌</button>
        `;
        row.querySelector("button").onclick = () => {
            selectedItemIds.delete(id);
            renderItems();
        };
        eventItemsDiv.appendChild(row);
    });
}

/* ===== COLLAGE ===== */

function renderCollage() {
    collageDiv.innerHTML = "";

    selectedItemIds.forEach(id => {
        const item = itemsById[id];
        if (!item.image_path) return;

        const img = document.createElement("img");
        const file = item.image_path.split("/").pop().replace(/\.[^/.]+$/, "");
        img.src = `/segmented/${item.category}/${file}_${item.category}.png`;
        collageDiv.appendChild(img);
    });
}

/* ===== SAVE ===== */

document.getElementById("saveBtn").onclick = async () => {
    const date = document.getElementById("eventDate").value;
    const notes = document.getElementById("notes").value || null;

    if (!date || selectedItemIds.size === 0) {
        statusEl.textContent = "Выберите дату и items";
        statusEl.className = "error";
        return;
    }

    const savedItems = [];

    for (const itemId of selectedItemIds) {
        await fetch("/wear_log/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                item_id: itemId,
                event_id: currentEventId,
                date,
                notes
            })
        });
        savedItems.push(itemsById[itemId].item);
    }

    savedEventDiv.innerHTML = `
        <b>Event ${currentEventId}</b>
        ${savedItems.map(i => `<div>• ${i}</div>`).join("")}
    `;

    statusEl.textContent = "✔ Выход сохранён";
    statusEl.className = "success";
};

/* ===== INIT ===== */

loadItems();
</script>

</body>
</html>
