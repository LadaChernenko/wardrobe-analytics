<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Внести запись</title>
<link rel="stylesheet" href="/static/base.css?v=3">
</head>

<body>

<header class="app-header">
    <h1>Внести запись эвента</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>

<div class="container grid two">

<!-- ===== LEFT ===== -->
<div class="left">
    <h3>Гардероб</h3>

    <input
        type="search"
        id="itemSearch"
        placeholder="Поиск по названию или бренду…"
        style="width:100%; margin-bottom:12px;"
    >

    <div id="categories" class="categories"></div>

    <div class="grouping">
        <button type="button" data-mode="none" class="active">Без групп</button>
        <button type="button" data-mode="season">По сезону</button>
        <button type="button" data-mode="style">По стилю</button>
    </div>

    <div id="itemsGrid"></div>
</div>

<!-- ===== RIGHT ===== -->
<div class="right">
    <div class="event-box">
        <h3>Текущий выход</h3>

        <label>
            Дата:
            <input type="date" id="eventDate">
        </label>

        <p class="muted" id="eventLabel" style="margin-top:8px;"></p>

        <div id="eventItems"></div>

        <div id="collage" class="collage"></div>

        <textarea id="notes" placeholder="Заметка" style="width:100%; margin-top:10px"></textarea>

        <button type="button" id="saveBtn" class="icon-btn primary" style="margin-top:10px;">
            Сохранить выход
        </button>
        <button type="button" id="newEventBtn" class="icon-btn" style="display:none; margin-top:10px;">
            Добавить ещё один выход
        </button>

        <p id="status"></p>

        <hr>

        <h4>Только что сохранённый выход</h4>
        <div id="savedEvent" class="muted">Пока нет данных</div>

        <a class="back-btn" href="/static/add_wear_log.html" style="margin-top:16px;">
            Перейти к логам →
        </a>
    </div>
</div>

</div>

<script src="/static/wear_event.js?v=3"></script>

</body>
</html>
