<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление предмета</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 420px;
            margin: 40px auto;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select, button {
            padding: 8px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        .success { color: green; }
        .error { color: red; }

        img {
            max-width: 100%;
            margin-top: 10px;
            display: none;
        }

        /* Drag & Drop */
        .drop-zone {
            border: 2px dashed #aaa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-radius: 6px;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #000;
            background: #f5f5f5;
        }
    </style>
</head>
<body>

<h2>Добавить предмет</h2>

<form id="itemForm" enctype="multipart/form-data">

    <input name="item" placeholder="Название" required>
    <input name="brand" placeholder="Бренд">

    <select name="category" required>
        <option value="" disabled selected>Категория</option>
        <option value="skirt">Юбка</option>
        <option value="upper_clothes">Верхняя одежда</option>
        <option value="tops">Верх</option>
        <option value="pants">Брюки</option>
        <option value="dress">Платье</option>
        <option value="bag">Сумка</option>
        <option value="hat">Головной убор</option>
        <option value="shoes">Обувь</option>
        <option value="sunglasses">Солнцезащитные очки</option>
        <option value="belt">Ремень</option>
        <option value="scarf">Шарф</option>
    </select>

    <select name="season" required>
        <option value="" disabled selected>Сезон</option>
        <option value="winter">Зима</option>
        <option value="summer">Лето</option>
        <option value="off_season">Межсезонье</option>
    </select>

    <input name="year_of_buying" placeholder="Год покупки" type="number" required>
    <input name="style" placeholder="Стиль" required>
    <input name="damage" placeholder="Повреждения">
    <input name="extra_colour" placeholder="Доп. цвет">
    <input name="colour" placeholder="Основной цвет">
    <input name="cost" placeholder="Стоимость" type="number" required>
    <input name="use" placeholder="Использований" type="number" required>

    <!-- FILE INPUT -->
    <input type="file" id="imageInput" name="image" accept="image/*">

    <!-- DRAG & DROP -->
    <div id="dropZone" class="drop-zone">
        Перетащите изображение сюда
    </div>

    <button type="submit">Создать</button>
</form>

<img id="preview">
<p id="status"></p>

<script>
    const form = document.getElementById("itemForm");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");

    const fileInput = document.getElementById("imageInput");
    const urlInput = document.getElementById("imageUrl");
    const dropZone = document.getElementById("dropZone");

    function showPreview(src) {
        preview.src = src;
        preview.style.display = "block";
    }

    function resetFile() {
        fileInput.value = "";
    }

    function resetUrl() {
        urlInput.value = "";
    }

    /* File select */
    fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;

        resetUrl();
        showPreview(URL.createObjectURL(file));
    });

    /* URL input */
    urlInput.addEventListener("input", () => {
        const url = urlInput.value.trim();
        if (!url) {
            preview.style.display = "none";
            return;
        }

        resetFile();
        showPreview(url);
    });

    /* Drag & Drop */
    dropZone.addEventListener("dragover", e => {
        e.preventDefault();
        dropZone.classList.add("dragover");
    });

    dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
    });

    dropZone.addEventListener("drop", e => {
        e.preventDefault();
        dropZone.classList.remove("dragover");

        const file = e.dataTransfer.files[0];
        if (!file || !file.type.startsWith("image/")) return;

        resetUrl();

        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;

        showPreview(URL.createObjectURL(file));
    });

    /* Submit */
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        statusEl.textContent = "Отправка...";
        statusEl.className = "";

        const formData = new FormData(form);

        if (urlInput.value && fileInput.files.length) {
            formData.delete("image");
        }

        try {
            const response = await fetch("/items/", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            statusEl.textContent = "✔ Предмет добавлен!";
            statusEl.className = "success";
            form.reset();
            preview.style.display = "none";

        } catch (error) {
            console.error(error);
            statusEl.textContent = "Ошибка: не удалось добавить предмет.";
            statusEl.className = "error";
        }
    });
</script>

</body>
</html>
