<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление предмета</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 420px;
            margin: 40px auto;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input, select, button {
            padding: 8px;
            font-size: 15px;
        }
        button {
            cursor: pointer;
        }
        .success { color: green; }
        .error { color: red; }
        img {
            max-width: 100%;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<h2>Добавить предмет</h2>

<form id="itemForm" enctype="multipart/form-data">

    <input name="item" placeholder="Название" required>
    <input name="brand" placeholder="Бренд">

    <!-- CATEGORY -->
    <select name="category" required>
        <option value="" disabled selected>Категория</option>
        <option value="Skirt">Юбка</option>
        <option value="Upper-clothes">Верхняя одежда</option>
        <option value="Pants">Брюки</option>
        <option value="Dress">Платье</option>
        <option value="Bag">Сумка</option>
        <option value="Hat">Головной убор</option>
        <option value="Shoes">Обувь</option>
        <option value="Sunglasses">Солнцезащитные очки</option>
        <option value="Belt">Ремень</option>
        <option value="Scarf">Шарф</option>
    </select>

    <!-- SEASON -->
    <select name="season" required>
        <option value="" disabled selected>Сезон</option>
        <option value="winter">Зима</option>
        <option value="summer">Лето</option>
        <option value="off_season">Межсезонье</option>
    </select>

    <input name="year_of_buying" placeholder="Год покупки" type="number" required>
    <input name="style" placeholder="Стиль" required>
    <input name="damage" placeholder="Повреждения">
    <input name="extra_colour" placeholder="Доп. цвет">
    <input name="colour" placeholder="Основной цвет">

    <input name="cost" placeholder="Стоимость" type="number" required>
    <input name="use" placeholder="Использований" type="number" required>

    <input type="file" name="image" accept="image/*">

    <button type="submit">Создать</button>
</form>

<img id="preview">
<p id="status"></p>

<script>
    const form = document.getElementById("itemForm");
    const statusEl = document.getElementById("status");
    const preview = document.getElementById("preview");
    const imageInput = form.querySelector('input[name="image"]');

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (!file) {
            preview.style.display = "none";
            return;
        }
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        statusEl.textContent = "Отправка...";
        statusEl.className = "";

        const formData = new FormData(form);

        try {
            const response = await fetch("/items/", {
                method: "POST",
                body: formData
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            statusEl.textContent = "✔ Предмет добавлен!";
            statusEl.className = "success";
            form.reset();
            preview.style.display = "none";

        } catch (error) {
            console.error(error);
            statusEl.textContent = "Ошибка: не удалось добавить предмет.";
            statusEl.className = "error";
        }
    });
</script>

</body>
</html>
