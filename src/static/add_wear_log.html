<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Wear Log</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 1000px;
            margin: 30px auto;
        }

        h2, h3 {
            margin-bottom: 10px;
        }

        button {
            cursor: pointer;
        }

        /* ===== events ===== */

        .event {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 12px;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-logs {
            margin-top: 8px;
            margin-left: 15px;
        }

        .log-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .muted {
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>

<h2>Добавить выход</h2>

<hr>

<h3>История выходов</h3>
<div id="eventsList"></div>

<script>
const eventsList = document.getElementById("eventsList");

// item_id -> item name
const itemsById = {};

/* ===== load items ===== */

async function loadItems() {
    const res = await fetch("/items/");
    const items = await res.json();

    items.forEach(item => {
        itemsById[item.id] = item.item;
    });
}

/* ===== load & prepare events ===== */

async function loadEvents() {
    const res = await fetch("/wear_log/");
    const logs = await res.json();

    // event_id -> { date, logs[] }
    const eventsMap = {};

    logs.forEach(log => {
        if (!eventsMap[log.event_id]) {
            eventsMap[log.event_id] = {
                date: log.date,
                logs: []
            };
        }

        eventsMap[log.event_id].logs.push(log);

        // на случай если даты в логах отличаются — берём самую свежую
        if (log.date > eventsMap[log.event_id].date) {
            eventsMap[log.event_id].date = log.date;
        }
    });

    // превращаем в массив и сортируем:
    // самые близкие к сегодняшней дате — сверху
    const sortedEvents = Object.entries(eventsMap)
        .map(([eventId, data]) => ({
            eventId,
            date: data.date,
            logs: data.logs
        }))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderEvents(sortedEvents);
}

/* ===== render ===== */

function renderEvents(events) {
    eventsList.innerHTML = "";

    events.forEach(event => {
        const eventDiv = document.createElement("div");
        eventDiv.className = "event";

        const header = document.createElement("div");
        header.className = "event-header";

        const formattedDate = event.date
            ? new Date(event.date).toLocaleDateString("ru-RU")
            : "—";

        header.innerHTML = `
            <b>Event ${event.eventId} <span class="muted">(${formattedDate})</span></b>
            <button>🗑 удалить event</button>
        `;

        header.querySelector("button").onclick = () => deleteEvent(event.eventId);
        eventDiv.appendChild(header);

        const logsDiv = document.createElement("div");
        logsDiv.className = "event-logs";

        // сортировка логов внутри event (на всякий случай)
        event.logs
            .sort((a, b) => new Date(b.date) - new Date(a.date))
            .forEach(log => {
                const itemName = itemsById[log.item_id] || `item #${log.item_id}`;

                const row = document.createElement("div");
                row.className = "log-row";
                row.innerHTML = `
                    <span>${itemName}</span>
                    <button>❌</button>
                `;

                row.querySelector("button").onclick = () => deleteLog(log.id);
                logsDiv.appendChild(row);
            });

        eventDiv.appendChild(logsDiv);
        eventsList.appendChild(eventDiv);
    });
}

/* ===== delete ===== */

async function deleteEvent(eventId) {
    if (!confirm(`Удалить event ${eventId}?`)) return;
    await fetch(`/wear_log/${eventId}`, { method: "DELETE" });
    loadEvents();
}

async function deleteLog(id) {
    if (!confirm("Удалить эту запись?")) return;
    await fetch(`/wear_log/${id}`, { method: "DELETE" });
    loadEvents();
}

/* ===== init ===== */

(async () => {
    await loadItems();
    await loadEvents();
})();
</script>

</body>
</html>
