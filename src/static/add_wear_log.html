<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Wear Log</title>

<style>
:root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text-main: #1f2933;
    --text-secondary: #6b7280;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    --radius: 18px;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-main);
}

/* ===== PAGE HEADER ===== */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px;
}

h1 {
    margin: 0;
    font-size: 32px;
}

.back-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
}

.back-btn:hover {
    background: var(--accent-hover);
}
h2 {
    margin: 0;
    padding: 32px;
    font-size: 32px;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 0 32px 24px;
}

/* ===== MAIN LIST ===== */

#eventsList {
    max-width: 1200px;
    margin: auto;
    padding: 0 32px 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* ===== EVENT CARD ===== */

.event {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
}

.event-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.event-header b {
    font-size: 16px;
}

.muted {
    color: var(--text-secondary);
    font-size: 13px;
}

/* ===== ACTION BUTTONS ===== */

.event-actions {
    display: flex;
    gap: 8px;
}

.event-actions button {
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 10px;
    background: #fafafa;
    border: 1px solid #ddd;
    color: var(--text-main);
}

.event-actions button:hover {
    background: #f3f4f6;
}


/* .event-actions button {
    display: flex;
    align-items: center;
    gap: 6px;
} */

.event-actions img {
    width: 14px;
    height: 14px;
}

/* ===== GRID ===== */

.event-grid {
    display: grid;
    /* grid-template-columns: 2fr 1fr; */
    gap: 20px;
}

/* ===== LEFT: LOGS ===== */

.event-logs {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}

.log-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 4px 0;
}

.log-row button {
    background: none;
    border: none;
    cursor: pointer;
}

.log-card {
    position: relative;
    background: #fafafa;
    border-radius: 14px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.log-image {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.log-image img {
    max-width: 90px;
    max-height: 120px;
    object-fit: contain;
}

.log-name {
    font-size: 13px;
    margin-top: 6px;
    text-align: center;
}

.log-del {
    position: absolute;
    top: 6px;
    right: 6px;

    width: 24px;
    height: 24px;

    padding: 0;
    border: none;
    border-radius: 50%;

    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}
.log-del img {
    width: 14px;
    height: 14px;
}
/* .log-del:hover {
    background: #fee2e2;
} */
.log-del:hover img {
            opacity: 1;
            transform: scale(1.1);
        }


/* ===== ADD ITEMS ===== */

.add-items {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed #ddd;
    display: none;
}

.items-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px 12px;
    margin-bottom: 10px;
}

.items-list label {
    font-size: 13px;
    color: var(--text-main);
}

/* ===== PRIMARY BUTTON ===== */

.add-items button {
    padding: 8px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
}

.add-items button:hover {
    background: var(--accent-hover);
}

/* ===== ICONS ===== */


.icon-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: #fafafa;
    cursor: pointer;
    font-size: 13px;
}

.icon-btn img {
    width: 16px;
    height: 16px;
    opacity: 0.8;
}

.icon-btn:hover img {
    opacity: 1;
}

/* ===== RIGHT: COLLAGE ===== */

.collage {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
}

.collage img {
    width: 100%;
    height: 90px;
    object-fit: contain;
    border-radius: 12px;
    background: #fafafa;
}

</style>
</head>

<body>

<!-- <h2></h2> -->
<header>
    <h1>История выходов</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>
<button type="button" onclick="exportLogsCSV()" class="icon-btn" title="Экспорт CSV">
    <img src="/static/icons/save.png" alt="Экспорт CSV">
    <span>Экспорт CSV</span>
</button>
<hr>

<div id="eventsList"></div>

<script>
const eventsList = document.getElementById("eventsList");

// item_id -> full item
const itemsById = {};
const allItems = [];

function exportLogsCSV() {
    window.location.href = "/wear_log/export/csv";
}
/* ===== LOAD ITEMS ===== */

async function loadItems() {
    const res = await fetch("/items/");
    const items = await res.json();

    items.forEach(item => {
        itemsById[item.id] = item;
        allItems.push(item);
    });
}

/* ===== LOAD EVENTS ===== */

async function loadEvents() {
    const res = await fetch("/wear_log/");
    const logs = await res.json();

    const eventsMap = {};

    logs.forEach(log => {
        if (!eventsMap[log.event_id]) {
            eventsMap[log.event_id] = {
                date: log.date,
                logs: []
            };
        }
        eventsMap[log.event_id].logs.push(log);

        if (log.date > eventsMap[log.event_id].date) {
            eventsMap[log.event_id].date = log.date;
        }
    });

    const events = Object.entries(eventsMap)
        .map(([eventId, data]) => ({
            eventId: Number(eventId),
            date: data.date,
            logs: data.logs
        }))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderEvents(events);
}

/* ===== RENDER ===== */

function renderEvents(events) {
    eventsList.innerHTML = "";

    events.forEach(event => {
        const eventDiv = document.createElement("div");
        eventDiv.className = "event";

        const formattedDate = event.date
            ? new Date(event.date).toLocaleDateString("ru-RU")
            : "—";
        const totalCost = event.logs.reduce(
            (sum, log) => sum + (log.current_cost_per_use ?? 0),
            0
        );

        eventDiv.innerHTML = `
            <div class="event-header">
                <div>
                    <b>Event ${event.eventId}
                        <span class="muted">(${formattedDate})</span>
                    </b>
                    <div class="muted">
                        Стоимость выхода: <b>${totalCost.toFixed(2)} ₽</b>
                    </div>
                </div>

                <div class="event-actions">
                    <button class="add-btn">
                        <img src="/static/icons/pencil.png">
                        items
                    </button>

                    <button class="del-btn">
                        <img src="/static/icons/bin.png">
                        event
                    </button>
                </div>
            </div>
        `;

        eventDiv.querySelector(".del-btn").onclick =
            () => deleteEvent(event.eventId);

        const grid = document.createElement("div");
        grid.className = "event-grid";

        /* ===== LEFT ===== */

        const left = document.createElement("div");
        const logsDiv = document.createElement("div");
        logsDiv.className = "event-logs";

        const existingItemIds = new Set();

        event.logs.forEach(log => {
            existingItemIds.add(log.item_id);
            const item = itemsById[log.item_id];

        const row = document.createElement("div");
        row.className = "log-card";

        const file = item?.image_path
            ? item.image_path.split("/").pop().replace(/\.[^/.]+$/, "")
            : null;

        row.innerHTML = `
            <div class="log-image">
                ${
                    file
                        ? `<img src="/segmented/${item.category}/${file}_${item.category}.png">`
                        : ""
                }
            </div>

            <div class="log-name">
                ${item?.item || `item #${log.item_id}`}
            </div>

            <button class="icon-btn log-del">
                <img src="/static/icons/bin.png" alt="Удалить">
            </button>
        `;

            row.querySelector(".log-del").onclick = () => deleteLog(log.id);

            logsDiv.appendChild(row);
        });

        left.appendChild(logsDiv);

        /* ===== ADD ITEMS ===== */

        const addPanel = document.createElement("div");
        addPanel.className = "add-items";

        const list = document.createElement("div");
        list.className = "items-list";

        allItems.forEach(item => {
            if (existingItemIds.has(item.id)) return;
            const label = document.createElement("label");
            label.innerHTML = `
                <input type="checkbox" value="${item.id}">
                ${item.item}
            `;
            list.appendChild(label);
        });

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Добавить выбранные";


        btn.onclick = async () => {
            const ids = [...list.querySelectorAll("input:checked")]
                .map(cb => Number(cb.value));

            if (!ids.length) return;

            await fetch(`/wear_log/${event.eventId}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(ids)
            });

            await loadEvents();
            return;
        };

        addPanel.appendChild(list);
        addPanel.appendChild(btn);
        left.appendChild(addPanel);

        eventDiv.querySelector(".add-btn").onclick =
            () => addPanel.style.display =
                addPanel.style.display === "none" ? "block" : "none";

        // /* ===== RIGHT (COLLAGE) ===== */

        // const right = document.createElement("div");
        // const collage = document.createElement("div");
        // collage.className = "collage";

        // event.logs.forEach(log => {
        //     const item = itemsById[log.item_id];
        //     if (!item?.image_path) return;

        //     const file = item.image_path
        //         .split("/")
        //         .pop()
        //         .replace(/\.[^/.]+$/, "");

        //     const img = document.createElement("img");
        //     img.src = `/segmented/${item.category}/${file}_${item.category}.png`;

        //     collage.appendChild(img);
        // });

        // right.appendChild(collage);

        grid.appendChild(left);
        // grid.appendChild(right);

        eventDiv.appendChild(grid);
        eventsList.appendChild(eventDiv);
    });
}

/* ===== DELETE ===== */

async function deleteEvent(eventId) {
    if (!confirm(`Удалить event ${eventId}?`)) return;
    await fetch(`/wear_log/event/${eventId}`, { method: "DELETE" });
    loadEvents();
}

async function deleteLog(id) {
    if (!confirm("Удалить запись?")) return;
    await fetch(`/wear_log/log/${id}`, { method: "DELETE" });
    loadEvents();
}

/* ===== INIT ===== */

(async () => {
    await loadItems();
    await loadEvents();
})();
</script>

</body>
</html>
