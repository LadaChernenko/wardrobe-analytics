<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Wear Log</title>

<style>
:root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text-main: #1f2933;
    --text-secondary: #6b7280;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    --radius: 18px;
}

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-main);
}

/* ===== PAGE HEADER ===== */

h2 {
    margin: 0;
    padding: 32px;
    font-size: 32px;
}

hr {
    border: none;
    border-top: 1px solid #eee;
    margin: 0 32px 24px;
}

/* ===== MAIN LIST ===== */

#eventsList {
    max-width: 1200px;
    margin: auto;
    padding: 0 32px 48px;
    display: flex;
    flex-direction: column;
    gap: 24px;
}

/* ===== EVENT CARD ===== */

.event {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 24px;
}

.event-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.event-header b {
    font-size: 16px;
}

.muted {
    color: var(--text-secondary);
    font-size: 13px;
}

/* ===== ACTION BUTTONS ===== */

.event-actions {
    display: flex;
    gap: 8px;
}

.event-actions button {
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 10px;
    background: #fafafa;
    border: 1px solid #ddd;
    color: var(--text-main);
}

.event-actions button:hover {
    background: #f3f4f6;
}

/* ===== GRID ===== */

.event-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

/* ===== LEFT: LOGS ===== */

.event-logs {
    margin-left: 6px;
}

.log-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 4px 0;
}

.log-row button {
    background: none;
    border: none;
    cursor: pointer;
}

/* ===== ADD ITEMS ===== */

.add-items {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed #ddd;
    display: none;
}

.items-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 6px 12px;
    margin-bottom: 10px;
}

.items-list label {
    font-size: 13px;
    color: var(--text-main);
}

/* ===== PRIMARY BUTTON ===== */

.add-items button {
    padding: 8px 12px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
}

.add-items button:hover {
    background: var(--accent-hover);
}

/* ===== RIGHT: COLLAGE ===== */

.collage {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 8px;
}

.collage img {
    width: 100%;
    height: 90px;
    object-fit: contain;
    border-radius: 12px;
    background: #fafafa;
}

</style>
</head>

<body>

<!-- <h2></h2> -->
<header>
    <h1>История выходов</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>
<hr>

<div id="eventsList"></div>

<script>
const eventsList = document.getElementById("eventsList");

// item_id -> full item
const itemsById = {};
const allItems = [];

/* ===== LOAD ITEMS ===== */

async function loadItems() {
    const res = await fetch("/items/");
    const items = await res.json();

    items.forEach(item => {
        itemsById[item.id] = item;
        allItems.push(item);
    });
}

/* ===== LOAD EVENTS ===== */

async function loadEvents() {
    const res = await fetch("/wear_log/");
    const logs = await res.json();

    const eventsMap = {};

    logs.forEach(log => {
        if (!eventsMap[log.event_id]) {
            eventsMap[log.event_id] = {
                date: log.date,
                logs: []
            };
        }
        eventsMap[log.event_id].logs.push(log);

        if (log.date > eventsMap[log.event_id].date) {
            eventsMap[log.event_id].date = log.date;
        }
    });

    const events = Object.entries(eventsMap)
        .map(([eventId, data]) => ({
            eventId: Number(eventId),
            date: data.date,
            logs: data.logs
        }))
        .sort((a, b) => new Date(b.date) - new Date(a.date));

    renderEvents(events);
}

/* ===== RENDER ===== */

function renderEvents(events) {
    eventsList.innerHTML = "";

    events.forEach(event => {
        const eventDiv = document.createElement("div");
        eventDiv.className = "event";

        const formattedDate = event.date
            ? new Date(event.date).toLocaleDateString("ru-RU")
            : "—";

        eventDiv.innerHTML = `
            <div class="event-header">
                <b>Event ${event.eventId}
                    <span class="muted">(${formattedDate})</span>
                </b>
                <div class="event-actions">
                    <button class="add-btn">➕ items</button>
                    <button class="del-btn">🗑 event</button>
                </div>
            </div>
        `;

        eventDiv.querySelector(".del-btn").onclick =
            () => deleteEvent(event.eventId);

        const grid = document.createElement("div");
        grid.className = "event-grid";

        /* ===== LEFT ===== */

        const left = document.createElement("div");
        const logsDiv = document.createElement("div");
        logsDiv.className = "event-logs";

        const existingItemIds = new Set();

        event.logs.forEach(log => {
            existingItemIds.add(log.item_id);
            const item = itemsById[log.item_id];

            const row = document.createElement("div");
            row.className = "log-row";
            row.innerHTML = `
                <span>${item?.item || `item #${log.item_id}`}</span>
                <button>❌</button>
            `;

            row.querySelector("button").onclick =
                () => deleteLog(log.id);

            logsDiv.appendChild(row);
        });

        left.appendChild(logsDiv);

        /* ===== ADD ITEMS ===== */

        const addPanel = document.createElement("div");
        addPanel.className = "add-items";

        const list = document.createElement("div");
        list.className = "items-list";

        allItems.forEach(item => {
            if (existingItemIds.has(item.id)) return;
            const label = document.createElement("label");
            label.innerHTML = `
                <input type="checkbox" value="${item.id}">
                ${item.item}
            `;
            list.appendChild(label);
        });

        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "Добавить выбранные";


        btn.onclick = async () => {
            const ids = [...list.querySelectorAll("input:checked")]
                .map(cb => Number(cb.value));

            if (!ids.length) return;

            await fetch(`/wear_log/${event.eventId}/items`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(ids)
            });

            await loadEvents();
            return;
        };

        addPanel.appendChild(list);
        addPanel.appendChild(btn);
        left.appendChild(addPanel);

        eventDiv.querySelector(".add-btn").onclick =
            () => addPanel.style.display =
                addPanel.style.display === "none" ? "block" : "none";

        /* ===== RIGHT (COLLAGE) ===== */

        const right = document.createElement("div");
        const collage = document.createElement("div");
        collage.className = "collage";

        event.logs.forEach(log => {
            const item = itemsById[log.item_id];
            if (!item?.image_path) return;

            const file = item.image_path
                .split("/")
                .pop()
                .replace(/\.[^/.]+$/, "");

            const img = document.createElement("img");
            img.src = `/segmented/${item.category}/${file}_${item.category}.png`;

            collage.appendChild(img);
        });

        right.appendChild(collage);

        grid.appendChild(left);
        grid.appendChild(right);

        eventDiv.appendChild(grid);
        eventsList.appendChild(eventDiv);
    });
}

/* ===== DELETE ===== */

async function deleteEvent(eventId) {
    if (!confirm(`Удалить event ${eventId}?`)) return;
    await fetch(`/wear_log/${eventId}`, { method: "DELETE" });
    loadEvents();
}

async function deleteLog(id) {
    if (!confirm("Удалить запись?")) return;
    await fetch(`/wear_log/${id}`, { method: "DELETE" });
    loadEvents();
}

/* ===== INIT ===== */

(async () => {
    await loadItems();
    await loadEvents();
})();
</script>

</body>
</html>
