<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гардероб</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        select, input {
            padding: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f4f4f4;
            white-space: nowrap;
        }

        .actions button {
            margin-right: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        /* ---------- MODAL ---------- */

        .modal {
            display: none;               /* ← ТОЛЬКО none */
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;               /* ← открываем ТОЛЬКО классом */
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        img {
            max-width: 100%;
            margin-top: 8px;
            display: none;
        }

        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body>

<h2>Мой гардероб</h2>
<button onclick="openCreate()">➕ Добавить предмет</button>

<div class="controls">
    <select id="filterCategory">
        <option value="">Все категории</option>
        <option value="skirt">Юбка</option>
        <option value="upper_clothes">Верхняя одежда</option>
        <option value="tops">Верх</option>
        <option value="pants">Брюки</option>
        <option value="dress">Платье</option>
        <option value="bag">Сумка</option>
        <option value="hat">Головной убор</option>
        <option value="shoes">Обувь</option>
        <option value="sunglasses">Солнцезащитные очки</option>
        <option value="belt">Ремень</option>
        <option value="scarf">Шарф</option>
    </select>

    <select id="sortMode">
        <option value="">Без сортировки</option>
        <option value="cost_per_use_desc">Cost / use ↓</option>
        <option value="cost_per_use_asc">Cost / use ↑</option>
    </select>

    <label>
        <input type="checkbox" id="groupByCategory">
        Группировать по категориям
    </label>
</div>

<table>
    <thead>
    <tr>
        <th>Название</th>
        <th>Бренд</th>
        <th>Категория</th>
        <th>Сезон</th>
        <th>Год</th>
        <th>Стиль</th>
        <th>Цвет</th>
        <th>Стоимость</th>
        <th>Использований</th>
        <th>Cost / use</th>
        <th></th>
    </tr>
    </thead>
    <tbody id="itemsTable"></tbody>
</table>

<!-- MODAL -->

<div class="modal" id="itemModal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>

        <form id="itemForm" enctype="multipart/form-data">
            <input name="item" placeholder="Название" required>
            <input name="brand" placeholder="Бренд">

            <select name="category" required>
                <option value="" disabled selected>Категория</option>
                <option value="skirt">Юбка</option>
                <option value="upper_clothes">Верхняя одежда</option>
                <option value="tops">Верх</option>
                <option value="pants">Брюки</option>
                <option value="dress">Платье</option>
                <option value="bag">Сумка</option>
                <option value="hat">Головной убор</option>
                <option value="shoes">Обувь</option>
            </select>

            <select name="season" required>
                <option value="" disabled selected>Сезон</option>
                <option value="winter">Зима</option>
                <option value="summer">Лето</option>
                <option value="off_season">Межсезонье</option>
            </select>

            <input name="year_of_buying" type="number" placeholder="Год покупки" required>
            <input name="style" placeholder="Стиль" required>
            <input name="colour" placeholder="Цвет">

            <input name="cost" type="number" placeholder="Стоимость" required>
            <input name="use" type="number" placeholder="Использований" required>

            <input type="file" name="image" accept="image/*">
            <img id="preview">

            <div style="display:flex; justify-content:space-between;">
                <button type="submit">💾 Сохранить</button>
                <button type="button" onclick="closeModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/items.js"></script>
</body>
</html>
