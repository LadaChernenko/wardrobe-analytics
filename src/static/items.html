<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гардероб</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }

        h2 {
            margin-bottom: 10px;
        }

        button {
            padding: 6px 10px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f4f4f4;
        }

        .actions button {
            margin-right: 5px;
        }

        /* ---------- MODAL ---------- */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 420px;

            max-height: 90vh;
            overflow-y: auto;

            padding: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 8px;
            font-size: 14px;
        }

        img {
            max-width: 100%;
            margin-top: 8px;
            display: none;
        }

        .modal-footer {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body>

<h2>Мой гардероб</h2>
<button onclick="openCreate()">➕ Добавить предмет</button>

<table>
    <thead>
        <tr>
            <th>Название</th>
            <th>Категория</th>
            <th>Сезон</th>
            <th>Cost / use</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="itemsTable"></tbody>
</table>

<!-- ================= MODAL ================= -->

<div class="modal" id="itemModal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>

        <form id="itemForm" enctype="multipart/form-data">

            <input name="item" placeholder="Название" required>
            <input name="brand" placeholder="Бренд">

            <select name="category" required>
                <option value="" disabled selected>Категория</option>
                <option value="Skirt">Юбка</option>
                <option value="Upper-clothes">Верхняя одежда</option>
                <option value="Pants">Брюки</option>
                <option value="Dress">Платье</option>
                <option value="Bag">Сумка</option>
                <option value="Hat">Головной убор</option>
                <option value="Shoes">Обувь</option>
                <option value="Sunglasses">Очки</option>
                <option value="Belt">Ремень</option>
                <option value="Scarf">Шарф</option>
            </select>

            <select name="season" required>
                <option value="" disabled selected>Сезон</option>
                <option value="winter">Зима</option>
                <option value="summer">Лето</option>
                <option value="off_season">Межсезонье</option>
            </select>

            <input name="year_of_buying" type="number" placeholder="Год покупки" required>
            <input name="style" placeholder="Стиль" required>
            <input name="damage" placeholder="Повреждения">
            <input name="extra_colour" placeholder="Доп. цвет">
            <input name="colour" placeholder="Основной цвет">

            <input name="cost" type="number" placeholder="Стоимость" required>
            <input name="use" type="number" placeholder="Использований" required>

            <input type="file" name="image" accept="image/*">
            <img id="preview">

            <div class="modal-footer">
                <button type="submit">💾 Сохранить</button>
                <button type="button" onclick="closeModal()">Отмена</button>
            </div>

        </form>
    </div>
</div>

<!-- ================= SCRIPT ================= -->

<script>
    const table = document.getElementById("itemsTable");
    const modal = document.getElementById("itemModal");
    const form = document.getElementById("itemForm");
    const title = document.getElementById("modalTitle");
    const preview = document.getElementById("preview");
    const imageInput = form.querySelector('input[name="image"]');

    let currentItemId = null;

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (!file) {
            preview.style.display = "none";
            return;
        }
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    });

    async function loadItems() {
        const res = await fetch("/items/");
        const items = await res.json();

        table.innerHTML = "";

        for (const i of items) {
            table.innerHTML += `
                <tr>
                    <td>${i.item}</td>
                    <td>${i.category}</td>
                    <td>${i.season}</td>
                    <td>${i.cost_per_use}</td>
                    <td class="actions">
                        <button onclick='openEdit(${JSON.stringify(i)})'>✏️</button>
                        <button onclick='deleteItem(${i.id})'>🗑</button>
                    </td>
                </tr>
            `;
        }
    }

    function openCreate() {
        currentItemId = null;
        title.textContent = "Добавить предмет";
        form.reset();
        preview.style.display = "none";
        modal.style.display = "block";
    }

    function openEdit(item) {
        currentItemId = item.id;
        title.textContent = "Редактировать предмет";

        for (const key in item) {
            if (form[key]) {
                form[key].value = item[key] ?? "";
            }
        }

        preview.style.display = "none";
        modal.style.display = "block";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    async function deleteItem(id) {
        if (!confirm("Удалить предмет?")) return;
        await fetch(`/items/${id}`, { method: "DELETE" });
        loadItems();
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const method = currentItemId ? "PATCH" : "POST";
        const url = currentItemId ? `/items/${currentItemId}` : "/items/";

        const res = await fetch(url, {
            method,
            body: new FormData(form)
        });

        if (res.ok) {
            closeModal();
            loadItems();
        } else {
            alert("Ошибка сохранения");
        }
    });

    modal.addEventListener("click", (e) => {
        if (e.target === modal) {
            closeModal();
        }
    });

    loadItems();
</script>

</body>
</html>
