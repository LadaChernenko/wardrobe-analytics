<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гардероб</title>
    <link rel="stylesheet" href="/static/base.css">

    <style>
        /* ===== VIEW SWITCH ===== */
        .view-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .view-switch button {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fafafa;
            cursor: pointer;
            font-size: 13px;
        }

        .view-switch button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .back-btn {
            padding: 10px 16px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: var(--accent-hover);
        }
        /* ===== GALLERY ===== */
        .content-card {
            max-width: 1400px;      /* чтобы не растягивалось на ультрашироких */
            margin: 0 auto;         /* центрирование */
            padding: 20px 24px;     /* отступы от краёв */
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        .group {
            margin-bottom: 28px;
        }

        .group-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .item-card {
            background: #fafafa;
            border-radius: 14px;
            padding: 8px;
            position: relative;
            border: 2px solid transparent;

            display: flex;
            flex-direction: column;
            height: 220px; 
        }
        .item-image {
            flex: 1;                      
            display: flex;
            align-items: center;          
            justify-content: center;      
        }

        .item-image img {
            max-width: 120px;
            max-height: 160px;
            object-fit: contain;
        }

        .item-name {
            font-size: 13px;
            margin-top: 6px;
            text-align: center;
        }

        .item-actions {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* ===== TABLE ===== */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        th {
            text-align: left;
            color: var(--text-secondary);
        }

        tr {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        tr:hover {
            transform: scale(1.01);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            /* border: 1px solid rgba(0,0,0,0.1); */
        }


        th[data-sort] {
            cursor: pointer;
            user-select: none;
            position: relative;
            padding-right: 18px;
        }

        th[data-sort]:hover {
            color: var(--accent);
        }

        th[data-sort]::after {
            content: "⇅";
            position: absolute;
            right: 6px;
            opacity: 0.3;
            font-size: 12px;
        }

        th.sorted.asc::after {
            content: "▲";
            opacity: 1;
        }

        th.sorted.desc::after {
            content: "▼";
            opacity: 1;
        }

        th.sorted {
            color: var(--accent);
            font-weight: 500;
        }
        td {
            transition: background-color 0.2s ease;
        }

        td.actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        /* ===== ICONS ===== */


        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: #fafafa;
            cursor: pointer;
            font-size: 13px;
        }

        .icon-btn img {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }

        .icon-btn:hover img {
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
    <h1>Мой гардероб</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>

<button onclick="openCreate()" class="icon-btn" title="Добавить предмет">
    <img src="/static/icons/add.png" alt="Добавить предмет">
    <span>Добавить предмет</span>
</button>
<button type="button" onclick="exportItemsCSV()" class="icon-btn" title="Экспорт CSV">
    <img src="/static/icons/save.png" alt="Экспорт CSV">
    <span>Экспорт CSV</span>
</button>
<div class="controls">

    <div class="view-switch">
        <button id="viewTableBtn" class="active">Таблица</button>
        <button id="viewGridBtn">Галерея</button>
    </div>

    <select id="filterCategory">
        <option value="">Все категории</option>
        <option value="skirt">Юбка</option>
        <option value="upper_clothes">Верхняя одежда</option>
        <option value="tops">Верх</option>
        <option value="pants">Брюки</option>
        <option value="dress">Платье</option>
        <option value="bag">Сумка</option>
        <option value="hat">Головной убор</option>
        <option value="shoes">Обувь</option>
    </select>

    <select id="groupMode">
        <option value="none">Без групп</option>
        <option value="category">По категории</option>
        <option value="season">По сезону</option>
        <option value="style">По стилю</option>
    </select>
</div>

<!-- ===== TABLE VIEW ===== -->
<div class="content-card">
    <table id="tableView">
        <thead>
        <tr>
            <th>Название</th>
            <th>Бренд</th>
            <th>Категория</th>
            <th>Сезон</th>
            <th>Год</th>
            <th>Стиль</th>
            <th data-sort="cost">Стоимость</th>
            <th data-sort="use">Использований</th>
            <th data-sort="cost_per_use">Cost / use</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="itemsTable"></tbody>
    </table>

    <!-- ===== GRID VIEW ===== -->

    <div id="gridView" style="display:none"></div>
</div>
<!-- ===== MODAL ===== -->

<div class="modal" id="itemModal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>

        <form id="itemForm" enctype="multipart/form-data">
            <input name="item" placeholder="Название" required>
            <input name="brand" placeholder="Бренд">

            <select name="category" required>
                <option value="" disabled selected>Категория</option>
                <option value="skirt">Юбка</option>
                <option value="upper_clothes">Верхняя одежда</option>
                <option value="tops">Верх</option>
                <option value="pants">Брюки</option>
                <option value="dress">Платье</option>
                <option value="bag">Сумка</option>
                <option value="hat">Головной убор</option>
                <option value="shoes">Обувь</option>
            </select>

            <select name="season" required>
                <option value="" disabled selected>Сезон</option>
                <option value="winter">Зима</option>
                <option value="summer">Лето</option>
                <option value="off_season">Межсезонье</option>
            </select>

            <input name="year_of_buying" type="number" placeholder="Год покупки">
            <input name="style" placeholder="Стиль">
            <input name="colour" placeholder="Цвет">
            <input name="cost" type="number" placeholder="Стоимость">
            <input name="use" type="number" placeholder="Использований">

            <input type="file" name="image" accept="image/*">
            <img id="preview">

            <div style="display:flex; justify-content:space-between;">
                <button type="submit" class="icon-btn" title="Сохранить">
                    <img src="/static/icons/save.png" alt="Сохранить">
                    <span>Сохранить</span>
                </button>

                <button type="button" onclick="closeModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/items.js"></script>
</body>
</html>
