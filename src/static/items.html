<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Гардероб</title>
    <link rel="stylesheet" href="/static/base.css?v=3">
</head>

<body>

<header class="app-header">
    <h1>Мой гардероб</h1>
    <a class="back-btn" href="index.html">← На главную</a>
</header>

<div class="container">

    <div class="controls">
        <button type="button" onclick="openCreate()" class="icon-btn primary" title="Добавить предмет">
            <img src="/static/icons/add.png" alt="">
            <span>Добавить предмет</span>
        </button>
        <button type="button" onclick="exportItemsCSV()" class="icon-btn" title="Экспорт CSV">
            <img src="/static/icons/save.png" alt="">
            <span>Экспорт CSV</span>
        </button>
    </div>

    <div class="controls">
        <div class="view-switch">
            <button type="button" id="viewTableBtn">Таблица</button>
            <button type="button" id="viewGridBtn" class="active">Галерея</button>
        </div>

        <select id="filterCategory">
            <option value="">Все категории</option>
            <option value="skirt">Юбка</option>
            <option value="upper_clothes">Верхняя одежда</option>
            <option value="tops">Верх</option>
            <option value="pants">Брюки</option>
            <option value="dress">Платье</option>
            <option value="bag">Сумка</option>
            <option value="hat">Головной убор</option>
            <option value="shoes">Обувь</option>
        </select>

        <!-- Группировка имеет смысл только в галерее — в табличном виде
             мы скрываем этот select через JS, чтобы он не выглядел
             рабочим, но ничего не делающим. -->
        <span id="groupModeWrap">
            <select id="groupMode">
                <option value="none">Без групп</option>
                <option value="category">По категории</option>
                <option value="season">По сезону</option>
                <option value="style">По стилю</option>
            </select>
        </span>
    </div>

    <!-- ===== TABLE / GRID VIEW ===== -->
    <div class="content-card">
        <table id="tableView" style="display:none">
            <thead>
            <tr>
                <th>Название</th>
                <th>Бренд</th>
                <th>Категория</th>
                <th>Сезон</th>
                <th>Год</th>
                <th>Стиль</th>
                <th data-sort="cost">Стоимость</th>
                <th data-sort="use">Использований</th>
                <th data-sort="cost_per_use">Cost / use</th>
                <th></th>
            </tr>
            </thead>
            <tbody id="itemsTable"></tbody>
        </table>

        <div id="gridView"></div>
    </div>

</div>

<!-- ===== MODAL ===== -->

<div class="modal" id="itemModal">
    <div class="modal-content">
        <h3 id="modalTitle"></h3>

        <form id="itemForm" enctype="multipart/form-data">
            <input name="item" placeholder="Название" required>
            <input name="brand" placeholder="Бренд">

            <select name="category" required>
                <option value="" disabled selected>Категория</option>
                <option value="skirt">Юбка</option>
                <option value="upper_clothes">Верхняя одежда</option>
                <option value="tops">Верх</option>
                <option value="pants">Брюки</option>
                <option value="dress">Платье</option>
                <option value="bag">Сумка</option>
                <option value="hat">Головной убор</option>
                <option value="shoes">Обувь</option>
            </select>

            <select name="season" required>
                <option value="" disabled selected>Сезон</option>
                <option value="winter">Зима</option>
                <option value="summer">Лето</option>
                <option value="off_season">Межсезонье</option>
            </select>

            <input name="year_of_buying" type="number" placeholder="Год покупки">
            <input name="style" placeholder="Стиль">

            <label>
                Основной цвет:
                <div class="colour-row">
                    <div id="colourPreview" class="colour-preview"></div>
                    <input type="color" id="colourPicker">
                </div>
                <input
                    type="text"
                    name="colour"
                    id="colourInput"
                    placeholder="#000000"
                    pattern="^#[0-9A-Fa-f]{6}$"
                >
            </label>

            <label>
                Доп. цвет (необязательно):
                <div class="colour-row">
                    <div id="extraColourPreview" class="colour-preview"></div>
                    <input type="color" id="extraColourPicker">
                    <input
                        type="text"
                        name="extra_colour"
                        id="extraColourInput"
                        placeholder="#ffffff"
                        pattern="^#[0-9A-Fa-f]{6}$"
                    >
                </div>
            </label>

            <input name="cost" type="number" placeholder="Стоимость">
            <input name="use" type="number" placeholder="Использований">

            <input type="file" name="image" accept="image/*">
            <img id="preview" alt="Превью изображения вещи">

            <div class="form-actions">
                <button type="submit" class="icon-btn primary" title="Сохранить">
                    <img src="/static/icons/save.png" alt="">
                    <span>Сохранить</span>
                </button>

                <button type="button" class="ghost" onclick="closeModal()">Отмена</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/items.js?v=3"></script>

</body>
</html>
