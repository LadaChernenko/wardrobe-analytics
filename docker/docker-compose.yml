name: wardrobe_main_api


services:
  backend:
    env_file: .env
    container_name: wardrobe_main_api_backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ../data:/app/data
      - ../src/alembic/versions:/app/src/alembic/versions
      - ../model_weights:/app/model_weights
    restart: always
    ports:
      - "3000:6000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wardrobe_project

    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  postgres:
    image: postgres:16
    restart: always
    ports:
      - "6243:5432"
    env_file:
      - .env
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    networks:
      - wardrobe_project
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 3s
      timeout: 5s
      retries: 3


networks:
  wardrobe_project:
    external: true